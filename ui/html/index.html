<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GOland - Bienvenidos a la Isla Cuántica</title>
    <!-- Importación de Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&family=Quicksand:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/style.css">
    <style>
        :root {
            --space-bg: linear-gradient(135deg, #020617 0%, #0b0f19 50%, #0f172a 100%);
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            background: var(--space-bg);
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            font-family: 'Outfit', sans-serif;
            color: #f8fafc;
            cursor: pointer;
            user-select: none;
            position: relative;
        }

        /* Efecto de partículas de estrellas de fondo */
        .stars {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle, rgba(255,255,255,0.05) 1px, transparent 1px);
            background-size: 40px 40px;
            z-index: 1;
            opacity: 0.7;
        }

        .ambient-glow {
            position: absolute;
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, rgba(0, 173, 216, 0.08) 0%, transparent 70%);
            z-index: 2;
            pointer-events: none;
            border-radius: 50%;
        }

        .landing-wrapper {
            position: relative;
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            max-width: 90vw;
            animation: fadeIn 1.5s cubic-bezier(0.16, 1, 0.3, 1) both;
        }

        /* Isla levitando con animación */
        .island-container {
            position: relative;
            margin-bottom: 30px;
            animation: float 6s ease-in-out infinite;
        }

        .island-img {
            max-width: 550px;
            width: 75vw;
            height: auto;
            border-radius: 28px;
            filter: drop-shadow(0 20px 50px rgba(0, 173, 216, 0.25));
            border: 1px solid rgba(0, 173, 216, 0.15);
            background: rgba(15, 23, 42, 0.4);
            backdrop-filter: blur(10px);
            padding: 10px;
            transition: all 0.5s cubic-bezier(0.25, 1, 0.5, 1);
        }

        .island-img:hover {
            filter: drop-shadow(0 30px 60px rgba(0, 173, 216, 0.45));
            border-color: rgba(0, 173, 216, 0.5);
            transform: scale(1.02);
        }

        .pulsing-ring {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 105%;
            height: 105%;
            border-radius: 36px;
            border: 2px solid rgba(0, 173, 216, 0.3);
            animation: pulse-ring 3s cubic-bezier(0.215, 0.610, 0.355, 1) infinite;
            pointer-events: none;
            z-index: -1;
        }

        .title-glitch {
            font-size: 3.2rem;
            font-weight: 800;
            letter-spacing: 4px;
            margin: 0;
            background: linear-gradient(135deg, #ffffff 0%, #cbd5e1 50%, var(--color-cyan-go) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 4px 20px rgba(0, 173, 216, 0.15);
            text-transform: uppercase;
        }

        .pulse-text {
            font-family: 'Quicksand', sans-serif;
            font-size: 1.15rem;
            font-weight: 500;
            color: var(--color-text-dim);
            margin-top: 15px;
            letter-spacing: 1px;
            animation: textPulse 2s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-15px) rotate(1deg); }
        }

        @keyframes pulse-ring {
            0% { transform: translate(-50%, -50%) scale(0.95); opacity: 0.8; }
            100% { transform: translate(-50%, -50%) scale(1.1); opacity: 0; }
        }

        @keyframes textPulse {
            0%, 100% { opacity: 0.5; transform: scale(0.98); }
            50% { opacity: 1; transform: scale(1); }
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body onclick="window.location.href='/app'">
    <div class="stars"></div>
    <div class="ambient-glow"></div>
    <div class="landing-wrapper">
        <div class="island-container">
            <img src="/static/img/GOland.png" alt="La Isla de GOland" class="island-img">
            <div class="pulsing-ring"></div>
        </div>
        <h1 class="title-glitch">GOland</h1>
        <p class="pulse-text">Toca cualquier parte de la pantalla para ingresar a la isla...</p>
    </div>
</body>
</html>
