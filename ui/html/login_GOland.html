<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GOland - Protocolo de Ingreso</title>
    <!-- Importación de Fuentes Google -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&family=Quicksand:wght@400;700&display=swap" rel="stylesheet">
    
    <!-- Enlace al estilo Ciber-Zen con Glassmorphism -->
    <link rel="stylesheet" href="/static/css/style.css">
    <style>
        body, html {
            background-color: #020617;
            height: 100vh;
            width: 100vw;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            font-family: 'Outfit', sans-serif;
            margin: 0;
            position: relative;
        }

        /* Estrellas sutiles de fondo */
        .stars {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle, rgba(255,255,255,0.03) 1px, transparent 1px);
            background-size: 50px 50px;
            z-index: 1;
        }

        .ambient-glow {
            position: absolute;
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, rgba(0, 173, 216, 0.06) 0%, transparent 75%);
            z-index: 2;
            border-radius: 50%;
            pointer-events: none;
        }

        .login-box {
            width: 440px;
            max-width: 90vw;
            padding: 40px;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 20px;
            z-index: 10;
            position: relative;
            background: rgba(15, 23, 42, 0.45);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(20px) saturate(180%);
            animation: slideUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) both;
        }

        .login-logo {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            background: rgba(0, 173, 216, 0.08);
            border: 2px solid var(--color-cyan-go);
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 2.8rem;
            box-shadow: 0 0 30px rgba(0, 173, 216, 0.25);
            margin-bottom: 5px;
            animation: float 4s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-8px); }
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .login-title {
            font-family: 'Quicksand', sans-serif;
            font-size: 1.8rem;
            font-weight: 700;
            color: #ffffff;
            margin: 0;
            letter-spacing: 1px;
        }

        .login-desc {
            font-size: 0.9rem;
            color: var(--color-text-dim);
            line-height: 1.5;
            margin: 0 0 10px 0;
            font-family: 'Quicksand', sans-serif;
        }

        .buttons-container {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .btn-auth {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            width: 100%;
            padding: 14px;
            border-radius: 16px;
            text-decoration: none;
            font-family: 'Quicksand', sans-serif;
            font-weight: 700;
            font-size: 0.95rem;
            border: 1px solid rgba(255, 255, 255, 0.1);
            cursor: pointer;
            transition: all 0.25s cubic-bezier(0.25, 0.8, 0.25, 1);
        }

        .btn-auth:hover {
            transform: translateY(-2px);
        }

        .btn-auth:active {
            transform: scale(0.98);
        }

        /* Botón Google */
        .btn-google {
            background: #ea4335;
            color: #ffffff;
            box-shadow: 0 4px 15px rgba(234, 67, 53, 0.25);
        }
        .btn-google:hover {
            background: #f15b4f;
            box-shadow: 0 6px 20px rgba(234, 67, 53, 0.4);
            border-color: rgba(255, 255, 255, 0.2);
        }

        /* Botón GitHub */
        .btn-github {
            background: #1f2328;
            color: #ffffff;
            box-shadow: 0 4px 15px rgba(31, 35, 40, 0.25);
            border-color: rgba(255, 255, 255, 0.05);
        }
        .btn-github:hover {
            background: #2f353c;
            box-shadow: 0 6px 20px rgba(31, 35, 40, 0.4);
            border-color: rgba(255, 255, 255, 0.2);
        }

        /* Botón Email */
        .btn-email {
            background: rgba(0, 173, 216, 0.1);
            color: var(--color-cyan-go);
            border: 1px solid rgba(0, 173, 216, 0.3);
            box-shadow: 0 4px 15px rgba(0, 173, 216, 0.1);
        }
        .btn-email:hover {
            background: rgba(0, 173, 216, 0.25);
            box-shadow: 0 6px 20px rgba(0, 173, 216, 0.25);
            border-color: var(--color-cyan-go);
            color: #ffffff;
        }

        /* Formulario Email colapsable */
        .email-form-drawer {
            width: 100%;
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.4s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.3s ease;
            opacity: 0;
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-top: 5px;
        }

        .email-form-drawer.active {
            max-height: 220px;
            opacity: 1;
            margin-top: 15px;
        }

        .form-input {
            width: 100%;
            background: rgba(15, 23, 42, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 12px;
            padding: 12px 16px;
            color: #ffffff;
            font-family: 'Quicksand', sans-serif;
            font-size: 0.9rem;
            outline: none;
            transition: all 0.2s ease;
        }

        .form-input:focus {
            border-color: var(--color-cyan-go);
            box-shadow: 0 0 10px rgba(0, 173, 216, 0.2);
            background: rgba(15, 23, 42, 0.95);
        }

        .btn-submit-email {
            width: 100%;
            background: var(--color-cyan-go);
            color: #020617;
            font-family: 'Quicksand', sans-serif;
            font-weight: 700;
            font-size: 0.95rem;
            padding: 12px;
            border-radius: 12px;
            border: none;
            cursor: pointer;
            transition: all 0.2s ease;
            margin-top: 5px;
            box-shadow: 0 4px 12px rgba(0, 173, 216, 0.2);
        }

        .btn-submit-email:hover {
            background: #00c4f7;
            box-shadow: 0 6px 18px rgba(0, 173, 216, 0.45);
        }

        .divider {
            display: flex;
            align-items: center;
            width: 100%;
            margin: 5px 0;
            color: rgba(255,255,255,0.15);
            font-size: 0.8rem;
            font-family: 'Quicksand', sans-serif;
        }

        .divider::before, .divider::after {
            content: "";
            flex: 1;
            height: 1px;
            background: rgba(255,255,255,0.08);
        }

        .divider span {
            padding: 0 10px;
        }
    </style>
</head>
<body>
    <div class="stars"></div>
    <div class="ambient-glow"></div>

    <div class="panel-cristal login-box">
        <div class="login-logo">🐹</div>
        <h2 class="login-title">Protocolo de Ingreso</h2>
        <p class="login-desc">Sincroniza tu progreso cuántico en Supabase y materializa tu GOnion oficial.</p>
        
        <div class="buttons-container">
            <!-- Google OAuth estrictamente apuntando a /auth/google/login -->
            <a href="/auth/google/login" class="btn-auth btn-google">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#FFFFFF"/>
                    <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#FFFFFF" opacity="0.9"/>
                    <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z" fill="#FFFFFF" opacity="0.8"/>
                    <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z" fill="#FFFFFF" opacity="0.9"/>
                </svg>
                <span>Acceder con Google</span>
            </a>

            <!-- GitHub OAuth preparado para Supabase -->
            <a href="#" id="btn-github-login" class="btn-auth btn-github" onclick="alert('Iniciando conexión segura con GitHub en Supabase...')">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M15 22v-4a4.8 4.8 0 0 0-1-3.5c3 0 6-2 6-5.5.08-1.25-.27-2.48-1-3.5.28-1.15.28-2.35 0-3.5 0 0-1 0-3 1.5-2.64-.5-5.36-.5-8 0C6 2 5 2 5 2c-.3 1.15-.3 2.35 0 3.5A5.403 5.403 0 0 0 4 9c0 3.5 3 5.5 6 5.5-.39.49-.68 1.05-.85 1.65-.17.6-.22 1.23-.15 1.85v4"></path>
                    <path d="M9 18c-4.51 2-5-2-7-2"></path>
                </svg>
                <span>Acceder con GitHub</span>
            </a>

            <div class="divider"><span>o utiliza</span></div>

            <!-- Email & Password preparado para Supabase -->
            <button id="btn-email-toggle" class="btn-auth btn-email">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <rect width="20" height="16" x="2" y="4" rx="2"></rect>
                    <path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"></path>
                </svg>
                <span>Acceder con Email</span>
            </button>

            <!-- Formulario Email desplegable -->
            <div id="email-form-container" class="email-form-drawer">
                <input type="email" id="supabase-email" class="form-input" placeholder="Dirección de correo electrónico" required>
                <input type="password" id="supabase-password" class="form-input" placeholder="Contraseña de acceso" required>
                <button type="button" class="btn-submit-email" onclick="alert('Autenticando credenciales de Supabase...')">
                    Entrar a la Isla
                </button>
            </div>
        </div>
    </div>

    <script>
        const emailToggle = document.getElementById('btn-email-toggle');
        const emailForm = document.getElementById('email-form-container');

        emailToggle.addEventListener('click', () => {
            emailForm.classList.toggle('active');
            if (emailForm.classList.contains('active')) {
                setTimeout(() => {
                    document.getElementById('supabase-email').focus();
                }, 100);
            }
        });
    </script>
</body>
</html>
