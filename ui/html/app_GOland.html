<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GOland - Introducción</title>
    <!-- Importación de Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700&family=Quicksand:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/style.css">
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            background-color: #020617;
            overflow: hidden;
            font-family: 'Outfit', sans-serif;
            position: relative;
        }

        /* Contenedor de Video de pantalla completa */
        .video-background {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            overflow: hidden;
        }

        .video-background video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            filter: brightness(0.85) contrast(1.1);
        }

        /* Overlay oscuro sutil para mejorar legibilidad del botón */
        .video-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle, rgba(0,0,0,0) 50%, rgba(2,6,23,0.4) 100%);
            z-index: 2;
            pointer-events: none;
        }

        /* Botón absoluto arriba a la derecha */
        .skip-container {
            position: absolute;
            top: 30px;
            right: 30px;
            z-index: 10;
        }

        /* Clases base del botón Kawaii se definen aquí y en style.css */
        .boton-kawaii {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            background: linear-gradient(135deg, var(--color-neon-pink) 0%, var(--color-neon-accent) 100%);
            color: #ffffff;
            font-family: 'Quicksand', sans-serif;
            font-weight: 700;
            font-size: 0.95rem;
            padding: 12px 24px;
            border-radius: 50px;
            text-decoration: none;
            box-shadow: 0 4px 15px rgba(255, 42, 133, 0.4), 
                        inset 0 -2px 0px rgba(0, 0, 0, 0.15),
                        inset 0 2px 0px rgba(255, 255, 255, 0.25);
            border: 2px solid rgba(255, 255, 255, 0.2);
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            text-shadow: 0 1px 2px rgba(0, 0, 0, 0.2);
        }

        .boton-kawaii:hover {
            transform: scale(1.06) translateY(-2px);
            box-shadow: 0 8px 25px rgba(255, 42, 133, 0.6),
                        inset 0 -2px 0px rgba(0, 0, 0, 0.15),
                        inset 0 2px 0px rgba(255, 255, 255, 0.4);
            border-color: rgba(255, 255, 255, 0.4);
        }

        .boton-kawaii:active {
            transform: scale(0.96) translateY(1px);
            box-shadow: 0 3px 10px rgba(255, 42, 133, 0.4);
        }

        .boton-kawaii svg {
            transition: transform 0.2s ease;
        }

        .boton-kawaii:hover svg {
            transform: translateX(4px);
        }
    </style>
</head>
<body>
    <div class="video-background">
        <video autoplay loop muted playsinline>
            <source src="/videos/mp4.mp4" type="video/mp4">
            Tu navegador no soporta la reproducción de video.
        </video>
    </div>
    <div class="video-overlay"></div>

    <div class="skip-container">
        <a href="/login" class="boton-kawaii">
            <span>Skip / Saltar Intro</span>
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <path d="M5 12h14"></path>
                <path d="m12 5 7 7-7 7"></path>
            </svg>
        </a>
    </div>
</body>
</html>
